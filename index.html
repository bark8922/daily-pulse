<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Pulse</title>
<style>
:root { --bg:#fafaf9; --surface:#fff; --border:rgba(0,0,0,0.08); --bord2:rgba(0,0,0,0.16); --text:#1a1a19; --muted:#6b6b66; --faint:#9a9a94; --accent:#1d4ed8; --warn-bg:#fef3c7; --warn-fg:#92400e; --info-bg:#e0e7ff; --info-fg:#3730a3; --ok-bg:#dcfce7; --ok-fg:#166534; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; }
.page { max-width:1080px; margin:0 auto; padding:24px; }
header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; gap:16px; flex-wrap:wrap; }
h1 { font-size:22px; font-weight:600; margin:0; }
.sub { font-size:12px; color:var(--muted); margin:4px 0 0; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.controls input, .controls select { padding:6px 10px; font-size:13px; border:1px solid var(--bord2); border-radius:6px; background:var(--surface); font-family:inherit; }
.controls input { width:220px; }
.btn { padding:6px 12px; font-size:13px; border:1px solid var(--bord2); border-radius:6px; background:var(--surface); cursor:pointer; font-family:inherit; }
.btn:hover { background:var(--bg); }
.btn.primary { background:var(--text); color:var(--surface); border-color:var(--text); }
section.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:14px; }
h2 { font-size:16px; font-weight:600; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
h2 .count { font-size:12px; color:var(--muted); font-weight:400; }
.task { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
.task:first-of-type { border-top:0; }
.task.done .task-text { text-decoration:line-through; color:var(--faint); }
.task input[type=checkbox] { margin-top:4px; flex-shrink:0; cursor:pointer; }
.task-body { flex:1; min-width:0; }
.task-text { font-size:14px; word-wrap:break-word; }
.task-meta { font-size:12px; color:var(--muted); margin-top:3px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.task-meta a { color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--faint); }
.task-meta a:hover { color:var(--accent); border-bottom-color:var(--accent); }
.pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; background:var(--info-bg); color:var(--info-fg); white-space:nowrap; }
.pill.low { background:var(--warn-bg); color:var(--warn-fg); }
.pill.high { background:var(--ok-bg); color:var(--ok-fg); }
.pill.src { background:#f3f4f6; color:#525252; }
.pill-edit { appearance:none; -webkit-appearance:none; -moz-appearance:none; padding:1px 18px 1px 8px; border-radius:999px; font-size:11px; background:var(--info-bg); color:var(--info-fg); border:none; cursor:pointer; font-family:inherit; line-height:1.4; background-image:linear-gradient(45deg,transparent 50%,var(--info-fg) 50%),linear-gradient(135deg,var(--info-fg) 50%,transparent 50%); background-position:calc(100% - 8px) 6px,calc(100% - 4px) 6px; background-size:4px 4px; background-repeat:no-repeat; max-width:240px; text-overflow:ellipsis; overflow:hidden; }
.pill-edit:hover { background-color:#c7d2fe; }
.pill-edit.overridden { background-color:var(--warn-bg); color:var(--warn-fg); background-image:linear-gradient(45deg,transparent 50%,var(--warn-fg) 50%),linear-gradient(135deg,var(--warn-fg) 50%,transparent 50%); }
.dot { color:var(--faint); }
.grp { margin-top:12px; }
.grp summary { cursor:pointer; padding:8px 0; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; list-style:none; }
.grp summary::-webkit-details-marker { display:none; }
.grp summary::before { content:"\25B8"; font-size:10px; color:var(--muted); transition:transform 0.15s; }
.grp[open] summary::before { transform:rotate(90deg); }
.grp summary .count { font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; }
.empty { color:var(--muted); font-size:13px; padding:8px 0; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:var(--surface); border-radius:10px; padding:20px 24px; width:380px; box-shadow:0 10px 40px rgba(0,0,0,0.2); }
.modal h3 { margin:0 0 12px; font-size:16px; }
.modal label { display:block; font-size:12px; color:var(--muted); margin-top:10px; margin-bottom:4px; }
.modal input, .modal select { width:100%; padding:6px 10px; font-size:13px; border:1px solid var(--bord2); border-radius:6px; background:var(--surface); font-family:inherit; }
.modal-actions { margin-top:16px; display:flex; gap:8px; justify-content:flex-end; }
.sync-badge { display:inline-block; padding:1px 6px; border-radius:999px; font-size:10px; background:#f3f4f6; color:#525252; margin-left:6px; }
.sync-badge.on { background:var(--ok-bg); color:var(--ok-fg); }
.sync-badge.off { background:var(--warn-bg); color:var(--warn-fg); }
footer { margin-top:32px; font-size:11px; color:var(--faint); text-align:center; }
@media (max-width:600px) { .page { padding:16px; } .controls input { width:100%; } .controls { width:100%; } .modal { width:90%; } }
</style>
</head>
<body>
<div class="page">
<header>
<div><h1>Daily pulse <span id="syncBadge" class="sync-badge off" title="Click Settings to configure sync">sync off</span></h1><p class="sub" id="sub">Loading...</p></div>
<div class="controls">
<input type="search" id="q" placeholder="Search tasks..." />
<select id="pf"><option value="">All projects</option></select>
<button class="btn" id="newproj">+ New project</button>
<button class="btn" id="settings" title="Webhook settings">Settings</button>
<button class="btn" id="reset">Reset checks</button>
<button class="btn" id="archiveBtn" title="Show archived / aged-out items">Archive</button>
<button class="btn primary" id="refresh" title="Re-fetch + hide checked items">Refresh</button>
</div>
</header>
<section class="card"><h2>Today &amp; this week <span class="count" id="tc"></span></h2><div id="tl"></div></section>
<section class="card"><h2>By project <span class="count" id="pc"></span></h2><div id="pl"></div></section>
<section class="card"><h2>Maybe / low-confidence <span class="count" id="mc"></span></h2><div id="ml" style="display:none;"></div><button class="btn" id="mt" style="font-size:12px;">Show</button></section>
<section class="card"><h2>n8n fleet <span class="count" id="fc"></span></h2><div id="fl"></div></section>
<footer>Auto-refreshed each morning + EOD. Built from Fireflies, Gmail, Slack, Cowork sessions. Untouched items auto-archive after 21 days &mdash; re-tag one to keep it active.</footer>
</div>
<div id="modalRoot"></div>
<script>
var LS_CHK="dpChecked_v1";
var LS_OV="dpOverrides_v1";
var LS_WEBHOOK="dpWebhook_v1";
var LS_SECRET="dpSecret_v1";
var checked=new Set(JSON.parse(localStorage.getItem(LS_CHK)||"[]"));
var overrides=JSON.parse(localStorage.getItem(LS_OV)||"{}");
var hideDone=false;
var showArchived=false;
var DATA=null;
var CLOSED=new Set();
var SERVER_OV={};

function webhookCfg(){
  return {
    url: localStorage.getItem(LS_WEBHOOK) || "https://blakebarkley.app.n8n.cloud/webhook/daily-pulse-sync",
    secret: localStorage.getItem(LS_SECRET) || "97ubpfdoj9zPss2xf3UmS_WNtfk-ZJHb"
  };
}
function updateSyncBadge(){
  var b=document.getElementById("syncBadge");
  var ok=webhookCfg().url && webhookCfg().secret;
  b.textContent= ok ? "sync on" : "sync off";
  b.className="sync-badge " + (ok?"on":"off");
}

async function syncAction(action, payload){
  var cfg=webhookCfg();
  if(!cfg.url || !cfg.secret) return; // sync off, fail silently
  try {
    var res=await fetch(cfg.url, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action: action, payload: payload, secret: cfg.secret })
    });
    if(!res.ok) console.warn("sync", action, "failed", res.status);
  } catch(e){ console.warn("sync error", e); }
}

function legacyTid(t){return t.source_type+"::"+t.source+"::"+t.text.slice(0,60);}
function tid(t){return t.id || legacyTid(t);}
function isDone(t){ return checked.has(tid(t)) || checked.has(legacyTid(t)) || CLOSED.has(tid(t)); }
function isOv(t){ return overrides[tid(t)] || overrides[legacyTid(t)] || SERVER_OV[tid(t)]; }

function effectiveProject(t){
  var ov=overrides[tid(t)] || overrides[legacyTid(t)] || SERVER_OV[tid(t)];
  if(ov) return ov;
  return t.project;
}

function prov(t){
  var s=t.source||"";
  if(s.indexOf("fireflies/")===0) return "https://app.fireflies.ai/view/"+s.split("/")[1];
  if(s.indexOf("gmail/")===0) return "https://mail.google.com/mail/u/0/#inbox/"+s.split("/")[1];
  if(s.indexOf("slack/")===0){ var p=s.split("/"); if(p.length>=3) return "https://tribe-xyz.slack.com/archives/"+p[1]+"/p"+p[2].replace(".",""); }
  return null;
}

function rt(t){
  var id=tid(t);
  var done=isDone(t);
  var ovProj=isOv(t);
  var isOvBool=!!ovProj;
  var d=document.createElement("div");
  d.className="task"+(done?" done":"");

  var cb=document.createElement("input");
  cb.type="checkbox";
  cb.checked=done;
  cb.addEventListener("change",function(){
    if(cb.checked){ checked.add(id); CLOSED.add(id); }
    else{ checked.delete(id); CLOSED.delete(id); }
    localStorage.setItem(LS_CHK,JSON.stringify(Array.from(checked)));
    d.classList.toggle("done",cb.checked);
    syncAction(cb.checked?"close":"open", { task_id: id });
  });
  d.appendChild(cb);

  var b=document.createElement("div"); b.className="task-body";
  var tx=document.createElement("div"); tx.className="task-text"; tx.textContent=t.text;
  b.appendChild(tx);

  var m=document.createElement("div"); m.className="task-meta";

  var sel=document.createElement("select");
  sel.className="pill-edit"+(isOvBool?" overridden":"");
  sel.title=isOvBool?("Re-tagged from: "+(t.project_name||t.project)):"Click to re-tag";
  var effPid=effectiveProject(t);
  var inboxOpt=document.createElement("option");
  inboxOpt.value="inbox"; inboxOpt.textContent="📥 Needs sorting";
  if(effPid==="inbox") inboxOpt.selected=true;
  sel.appendChild(inboxOpt);
  DATA.projects.forEach(function(p){
    var o=document.createElement("option");
    o.value=p.id; o.textContent=p.name;
    if(p.id===effPid) o.selected=true;
    sel.appendChild(o);
  });
  sel.addEventListener("change",function(){
    var newPid=sel.value;
    if(newPid===t.project){
      delete overrides[id];
      delete SERVER_OV[id];
      syncAction("remove_override", { task_id: id });
    } else {
      overrides[id]=newPid;
      SERVER_OV[id]=newPid;
      syncAction("override", { task_id: id, project_id: newPid });
    }
    localStorage.setItem(LS_OV,JSON.stringify(overrides));
    render();
  });
  m.appendChild(sel);

  var cp=document.createElement("span");
  cp.className="pill "+(t.confidence==="high"?"high":t.confidence==="low"?"low":"src");
  cp.textContent=t.confidence;
  m.appendChild(cp);

  var sp=document.createElement("span"); sp.className="pill src"; sp.textContent=t.source_type;
  m.appendChild(sp);

  var dot=document.createElement("span"); dot.className="dot"; dot.textContent="·"; m.appendChild(dot);
  var ds=document.createElement("span"); ds.textContent=t.date||"—"; m.appendChild(ds);

  var ctx=(t.extras && (t.extras.subject||t.extras.meeting||t.extras.session||t.extras.channel))||null;
  var lnk=prov(t);
  if(ctx||lnk){
    var d2=document.createElement("span"); d2.className="dot"; d2.textContent="·"; m.appendChild(d2);
    if(lnk){
      var a=document.createElement("a"); a.href=lnk; a.target="_blank"; a.rel="noopener"; a.textContent=ctx||"open source";
      m.appendChild(a);
    } else {
      var sn=document.createElement("span"); sn.textContent=ctx; m.appendChild(sn);
    }
  }

  b.appendChild(m);
  d.appendChild(b);
  return d;
}

function bucket(tasks){
  var today=new Date(DATA.generated_at);
  var o={hr:[],bp:{},mb:[]};
  tasks.forEach(function(t){
    var pid=effectiveProject(t);
    if(t.confidence==="low"){ o.mb.push(t); return; }
    var dt=t.date?new Date(t.date):null;
    var age=dt?(today-dt)/86400000:999;
    if(t.confidence==="high"&&age<=5){ o.hr.push(t); return; }
    if(!o.bp[pid]) o.bp[pid]=[];
    o.bp[pid].push(t);
  });
  return o;
}

function render(){
  var q=document.getElementById("q").value.toLowerCase();
  var pf=document.getElementById("pf").value;
  var tasks=DATA.tasks.filter(function(t){
    var arch=(t.status==="archived");
    return showArchived ? arch : !arch;
  });
  if(q) tasks=tasks.filter(function(t){
    return t.text.toLowerCase().indexOf(q)>=0 || (t.project_name||"").toLowerCase().indexOf(q)>=0;
  });
  if(pf) tasks=tasks.filter(function(t){ return effectiveProject(t)===pf; });
  if(hideDone) tasks=tasks.filter(function(t){ return !isDone(t); });

  var b=bucket(tasks);

  var tl=document.getElementById("tl"); tl.innerHTML="";
  b.hr.sort(function(a,x){ return (x.date||"").localeCompare(a.date||""); });
  if(b.hr.length===0) tl.innerHTML='<div class="empty">No high-confidence items in last 5 days.</div>';
  else b.hr.forEach(function(t){ tl.appendChild(rt(t)); });
  document.getElementById("tc").textContent=b.hr.length;

  var pl=document.getElementById("pl"); pl.innerHTML="";
  var po=Object.keys(b.bp).sort(function(a,x){ return b.bp[x].length-b.bp[a].length; });
  po=po.filter(function(p){ return p!=="inbox"; });
  if(b.bp["inbox"]) po.unshift("inbox");
  var tp=0;
  po.forEach(function(pid){
    var items=b.bp[pid].sort(function(a,x){ return (x.date||"").localeCompare(a.date||""); });
    if(items.length===0) return;
    tp+=items.length;
    var pm=DATA.projects.find(function(p){ return p.id===pid; });
    var nm=pm?pm.name:(pid==="inbox"?"📥 Needs sorting":pid);
    var det=document.createElement("details"); det.className="grp";
    var sm=document.createElement("summary"); sm.innerHTML=nm+' <span class="count">('+items.length+')</span>';
    det.appendChild(sm);
    var inn=document.createElement("div"); inn.style.paddingLeft="16px";
    items.forEach(function(t){ inn.appendChild(rt(t)); });
    det.appendChild(inn);
    pl.appendChild(det);
  });
  document.getElementById("pc").textContent=tp;

  var ml=document.getElementById("ml"); ml.innerHTML="";
  b.mb.sort(function(a,x){ return (x.date||"").localeCompare(a.date||""); });
  b.mb.forEach(function(t){ ml.appendChild(rt(t)); });
  document.getElementById("mc").textContent=b.mb.length;

  var ovCount=Object.keys(overrides).length;
  var ovStr=ovCount>0?(" · "+ovCount+" re-tagged"):"";
  var hiddenStr=(hideDone&&checked.size>0)?(" · "+checked.size+" hidden"):"";
  var actC=(DATA.active_count!=null?DATA.active_count:DATA.total);
  var arcC=(DATA.archived_count||0);
  var viewStr=showArchived?" · ARCHIVE VIEW":"";
  document.getElementById("sub").textContent="Last scan: "+DATA.generated_at+" · "+actC+" active · "+arcC+" archived · "+tasks.length+" shown"+viewStr+ovStr+hiddenStr;
}

function sc(lr){
  if(!lr) return "low";
  var ad=(Date.now()-new Date(lr).getTime())/86400000;
  if(ad<2) return "high";
  if(ad<7) return "src";
  return "low";
}

function rf(fleet){
  var list=document.getElementById("fl"); list.innerHTML="";
  var ta=0,ts=0;
  fleet.groups.forEach(function(g){
    var act=g.workflows.filter(function(w){ return w.active; });
    if(act.length===0) return;
    ta+=act.length;
    var det=document.createElement("details"); det.className="grp";
    var sm=document.createElement("summary"); sm.innerHTML=g.name+' <span class="count">('+act.length+')</span>';
    det.appendChild(sm);
    var tbl=document.createElement("table");
    tbl.style.cssText="width:100%;font-size:13px;border-collapse:collapse;margin-top:8px;";
    tbl.innerHTML="<thead><tr style='color:var(--muted);font-size:11px;text-align:left;'><th style='padding:6px 8px;font-weight:400;'>Workflow</th><th style='padding:6px 8px;font-weight:400;'>Schedule</th><th style='padding:6px 8px;font-weight:400;'>Last run</th><th style='padding:6px 8px;font-weight:400;'>Status</th></tr></thead>";
    var tb=document.createElement("tbody");
    act.forEach(function(w){
      var tr=document.createElement("tr"); tr.style.cssText="border-top:1px solid var(--border);";
      var lrd=w.last_run?w.last_run.replace("T"," ").replace("Z",""):"—";
      var scl=sc(w.last_run);
      var ad=w.last_run?Math.floor((Date.now()-new Date(w.last_run).getTime())/86400000):null;
      var st=!w.last_run?"unknown":(ad>7?"stale":"OK");
      if(st==="stale") ts++;
      tr.innerHTML="<td style='padding:7px 8px;'>"+w.name+"</td><td style='padding:7px 8px;color:var(--muted);'>"+(w.schedule_hint||"—")+"</td><td style='padding:7px 8px;'>"+lrd+(ad!==null?" <span style='color:var(--faint);'>("+ad+"d)</span>":"")+"</td><td style='padding:7px 8px;'><span class='pill "+scl+"'>"+st+"</span></td>";
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    det.appendChild(tbl);
    list.appendChild(det);
  });
  document.getElementById("fc").textContent=ta+" active · "+ts+" stale · refreshed "+fleet.generated_at;
}

async function lf(){
  try{
    var r=await fetch("./data/n8n_fleet.json?t="+Date.now());
    if(!r.ok){ document.getElementById("fl").innerHTML='<div class="empty">No fleet data yet.</div>'; return; }
    var f=await r.json();
    rf(f);
  }catch(e){ console.error("fleet",e); }
}

async function loadServerState(){
  try {
    var c=await fetch("./data/closed.json?t="+Date.now());
    if(c.ok){ var cj=await c.json(); CLOSED=new Set(cj.ids||[]); }
  } catch(e){}
  try {
    var o=await fetch("./data/overrides.json?t="+Date.now());
    if(o.ok){ var oj=await o.json(); SERVER_OV=oj.overrides||{}; }
  } catch(e){}
}

async function load(){
  try{
    await loadServerState();
    var r=await fetch("./data/tasks.json?t="+Date.now());
    DATA=await r.json();
    var pf=document.getElementById("pf");
    while(pf.options.length>1) pf.remove(1);
    DATA.projects.forEach(function(p){
      var o=document.createElement("option");
      o.value=p.id; o.textContent=p.name;
      pf.appendChild(o);
    });
    render();
    lf();
  }catch(e){
    document.getElementById("sub").textContent="Load failed: "+e.message;
    console.error(e);
  }
}

// Modal helpers
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function showModal(html){ document.getElementById("modalRoot").innerHTML='<div class="modal-bg" onclick="if(event.target===this) document.getElementById(\'modalRoot\').innerHTML=\'\'"><div class="modal">'+html+'</div></div>'; }

function openSettings(){
  var cfg=webhookCfg();
  showModal('<h3>Sync settings</h3><label>Webhook URL</label><input id="cfgUrl" placeholder="https://n8n.example.com/webhook/daily-pulse-sync" value="'+(cfg.url||"")+'" /><label>Webhook secret</label><input id="cfgSecret" type="password" placeholder="paste the secret from the workflow" value="'+(cfg.secret||"")+'" /><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSettings()">Save</button></div>');
}
function saveSettings(){
  localStorage.setItem(LS_WEBHOOK, document.getElementById("cfgUrl").value.trim());
  localStorage.setItem(LS_SECRET, document.getElementById("cfgSecret").value.trim());
  updateSyncBadge();
  closeModal();
}

function openNewProject(){
  showModal('<h3>New project</h3><label>Name</label><input id="npName" placeholder="e.g. Q3 board prep" /><label>ID (auto-generated, edit if needed)</label><input id="npId" placeholder="q3-board" /><label>Tier</label><select id="npTier"><option value="big">big</option><option value="medium" selected>medium</option></select><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewProject()">Create</button></div>');
  document.getElementById("npName").addEventListener("input", function(){
    var v=this.value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24);
    document.getElementById("npId").value=v;
  });
}
async function saveNewProject(){
  var name=document.getElementById("npName").value.trim();
  var id=document.getElementById("npId").value.trim();
  var tier=document.getElementById("npTier").value;
  if(!name||!id){ alert("Name and ID required"); return; }
  // Add locally for immediate use
  DATA.projects.push({ id:id, name:name, tier:tier });
  // Update filter dropdown
  var pf=document.getElementById("pf");
  var o=document.createElement("option"); o.value=id; o.textContent=name; pf.appendChild(o);
  render();
  closeModal();
  // Sync to repo
  await syncAction("new_project", { id:id, name:name, tier:tier });
}

document.getElementById("q").addEventListener("input",render);
document.getElementById("pf").addEventListener("change",render);
document.getElementById("refresh").addEventListener("click",function(){ hideDone=true; load(); });
document.getElementById("reset").addEventListener("click",function(){
  if(confirm("Clear all locally-checked items (won't reopen on server)?")){
    checked.clear();
    localStorage.setItem(LS_CHK,"[]");
    hideDone=false;
    render();
  }
});
document.getElementById("mt").addEventListener("click",function(){
  var m=document.getElementById("ml"); var b=document.getElementById("mt");
  if(m.style.display==="none"){ m.style.display=""; b.textContent="Hide"; }
  else { m.style.display="none"; b.textContent="Show"; }
});
document.getElementById("settings").addEventListener("click", openSettings);
document.getElementById("newproj").addEventListener("click", openNewProject);
document.getElementById("archiveBtn").addEventListener("click",function(){
  showArchived=!showArchived;
  this.classList.toggle("primary",showArchived);
  this.textContent=showArchived?"← Back to active":"Archive";
  render();
});

updateSyncBadge();
load();
</script>
</body>
</html>
